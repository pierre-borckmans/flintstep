name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest # tests use fakes; nothing here needs CoreBluetooth, CoreMIDI or the Wails desktop tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # wails.json and Info.plist carry copies of product.env; fail if they drifted
      - run: scripts/product/sync.sh --check
      # package main embeds all:frontend/dist
      - run: make dist
      # internal/coremidi binds ALSA on Linux (cgo). snd-seq, when the runner's kernel
      # has it, lets the ALSA loopback test run instead of skipping.
      - name: ALSA headers and sequencer
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
          sudo modprobe snd-seq || echo "no snd-seq module: the ALSA loopback test will skip"
          if [ -e /dev/snd/seq ]; then sudo chmod a+rw /dev/snd/seq; fi
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; echo "run 'make fmt'"; exit 1; fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - run: go test ./... -race

  # The Ubuntu job can't compile the cgo darwin files (CoreMIDI, CoreBluetooth, tray).
  # This one only checks that they still build.
  go-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make dist
      - run: go build ./...
        env:
          CGO_ENABLED: "1"
      - run: go test ./...

  # The Linux app and its packages (experimental), built in the same Docker image as
  # `make linux`, natively on each architecture, then smoke-tested under Xvfb.
  linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from the tags
      - run: make linux LINUX_ARCHES=${{ matrix.arch }}
      - run: scripts/linux/docker.sh smoke ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/bin/linux/${{ matrix.arch }}/*.AppImage
            build/bin/linux/${{ matrix.arch }}/*.deb
            build/bin/linux/smoke/
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json # same bun as local, or the lockfile drifts
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run lint
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
