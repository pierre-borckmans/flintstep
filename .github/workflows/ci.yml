name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest # tests use fakes; nothing here needs CoreBluetooth, CoreMIDI or the Wails desktop tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # wails.json and Info.plist carry copies of product.env; fail if they drifted
      - run: scripts/product/sync.sh --check
      # package main embeds all:frontend/dist
      - run: make dist
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; echo "run 'make fmt'"; exit 1; fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - run: go test ./... -race

  # The Ubuntu job can't compile the cgo darwin files (CoreMIDI, CoreBluetooth, tray).
  # This one only checks that they still build.
  go-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make dist
      - run: go build ./...
        env:
          CGO_ENABLED: "1"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json # same bun as local, or the lockfile drifts
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run lint
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
