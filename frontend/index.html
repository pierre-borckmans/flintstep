<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SparkX MIDI</title>
    <script>
      // The forced theme, before the first paint (see src/lib/theme.ts). System needs
      // nothing: style.css follows prefers-color-scheme.
      try {
        var t = localStorage.getItem("sparkx.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
